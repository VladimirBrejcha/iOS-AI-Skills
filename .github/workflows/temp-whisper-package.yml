name: Temporary Whisper Package

on:
  push:
    branches:
      - temp/artifact-transfer-test-20260805

permissions:
  contents: read

jobs:
  package-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download multilingual Whisper small q5 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          curl -L --fail --retry 5 --retry-delay 3 \
            -o payload/ggml-small-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true'
          test -s payload/ggml-small-q5_1.bin
          sha256sum payload/ggml-small-q5_1.bin > payload/SHA256SUMS.txt
          ls -lh payload

      - name: Upload small multilingual model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: payload
          retention-days: 1
          compression-level: 0
