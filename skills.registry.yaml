  - id: swift-concurrency
    status: active
    source:
      type: external-git
      url: https://github.com/jamesrochabrun/skills.git
      path: skills/swift-concurrency
      pinned_tag: 2.1.1
      observed_commit: 2482c176372299c92af01f8414a67172f324e8db
      observed_at: "2026-07-09"
    exported_names:
      - swift-concurrency
    clients:
      codex: planned
      opencode: planned
      claude: planned
    scopes:
      - machine
      - repo
    update_policy: external-reviewed
    catalog:
      description: >
        Guide for building, auditing, and refactoring Swift code using modern
        concurrency patterns (Swift 6+). This skill should be used when
        working with async/await, Tasks, actors, MainActor, Sendable types,
        isolation domains, or when migrating legacy callback/Combine code to
        structured concurrency. Covers Approachable Concurrency settings,
        isolated parameters, and common pitfalls.
    notes:
      - Source owner reviewed on 2026-07-09. The exact checked-in
        swift-concurrency folder matched jamesrochabrun/skills tag 2.1.1 at
        commit 2482c176372299c92af01f8414a67172f324e8db and path
        skills/swift-concurrency.
      - Upstream repository license reviewed as MIT.
      - Deeper source-material review found
        tuist/fuckingapproachableswiftconcurrency, but that upstream SKILL.md
        is not an exact match for this packaged skill and has no exact tag;
        keep this entry pinned to the tagged exact skill source.
      - Example profile exposure is manual review until an upstream
        manager/import path can materialize this external source across Codex,
        OpenCode, and Claude Code without a local registry copy.

  - id: swift-testing
    status: active
    source:
      type: registry-local
      path: swift-testing
    exported_names:
      - swift-testing
    clients:
      codex: supported
      opencode: supported
      claude: supported
    scopes:
      - machine
      - repo
    update_policy: internal-reviewed
    notes:
      - Source owner replaced on 2026-07-10. This is a maintained
        registry-local fork of twostraws/Swift-Testing-Agent-Skill release
        1.0.0 at commit 29921fb187f1165cb8975791c7e11fbb23d03398 and
        upstream path swift-testing-pro.
      - Upstream repository license reviewed as MIT; upstream author metadata
        credits Paul Hudson.
      - >
        The local package replaces the previous johnrogers-derived single-file
        baseline. Local adaptations are limited to preserving the exported
        registry id and manager-selected name `swift-testing`, normalizing
        SKILL.md front matter to the repository contract, and updating
        agents/openai.yaml to invoke `$swift-testing`, plus reviewed correctness
        fixes for Swift Testing and Foundation examples that were inaccurate in
        upstream release 1.0.0.
      - Keep registry-local ownership until external-git aliases and manager
        installs can preserve the public `swift-testing` surface across
        doctor, catalog, sync, managed global profiles, and repo-local
        consumers without a local registry copy.
      - AvdLee/Swift-Testing-Agent-Skill tags through 1.2.0 were reviewed on
        2026-07-10 as a strong alternative, but this entry intentionally
        follows the requested TwoStraws package replacement.
      - Swift Testing framework guidance remains part of the managed profile
        expansion. After merge, refresh managed Codex and Claude Code global
        copies from fiveonecode/agent-skills so installed manager roots match
        the new lock digest.
      - Claude Code support uses the same proven manager install path for this
        exported skill name.
      - Repo-local usage remains manual review until project profile and
        upstream manager behavior have equivalent proof.

