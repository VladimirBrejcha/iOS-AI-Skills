    status: active
    source:
      type: registry-local
      path: code-review
    exported_names:
      - code-review
    clients:
      codex: supported
      opencode: supported
      claude: supported
    scopes:
      - machine
      - repo
    update_policy: internal-reviewed
    notes:
      - Existing Codex user adapter is already a symlink from
        a user-level skills directory to this registry path in one maintainer
        environment.
      - Claude Code support is proven through a pinned upstream manager write
        to ~/.claude/skills for this skill; additional Claude Code targets stay
        planned until separately promoted.

