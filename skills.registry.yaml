schema_version: 0.1
status: inventory-complete-review-pending
registry:
  id: agent-skills
  name: Agent Skills
  owner: maintainers
  manager_source: fiveonecode/agent-skills
  repo_path_hint: .
  purpose: >
    Versioned source and policy registry for reusable agent skills with an
    complete skill inventory with a reviewed shared-root baseline for Codex and OpenCode, a
    proven Claude Code global baseline for all active registry-local skills,
    plus planned/manual-review adapter coverage for repo-local and broader
    machine-level consumers.

rules:
  source_of_truth:
    - A skill source is edited only in its owning repository or upstream.
    - Consumer directories are adapter views, not editable sources.
    - External skills are pinned by exact tag before broad machine exposure
      until commit-only pins are supported end-to-end.
  adapters:
    - Prefer symlinks when a client has verified support.
    - Use upstream-manager-owned adapter copies only for explicit reviewed
      profiles that can be verified by source digest.
    - Adapter copies must carry or verify against a source digest and be
      replaced by the upstream manager, not edited by hand.
  rollout:
    - This manifest is both the registry policy source and the complete
      disposition inventory for every top-level SKILL.md folder.
    - Active entries have reviewed source ownership and lock metadata.
      Needs-source-review and legacy entries are inventory-only and cannot be
      locked, exported, or installed.
    - Unresolved-local records describe checked-in content without claiming
      that this repository owns or can redistribute it as an active skill.
    - Sync planning must stay report-only; adapter writes use the upstream
      skills manager where supported.

skills:
  - id: code-review
    status: active
    source:
      type: registry-local
      path: code-review
    exported_names:
      - code-review
    clients:
      codex: supported
      opencode: supported
      claude: supported
    scopes:
      - machine
      - repo
    update_policy: internal-reviewed
    notes:
      - Existing Codex user adapter is already a symlink from
        a user-level skills directory to this registry path in one maintainer
        environment.
      - Claude Code support is proven through a pinned upstream manager write
        to ~/.claude/skills for this skill; additional Claude Code targets stay
        planned until separately promoted.

  - id: harness-engineering
    status: active
    source:
