        registry-local fork of Dimillian/Skills commit
        05ba982bfeb0d77d3c97d4542b0ee15034d05f84 at path
        swiftui-view-refactor.
      - Upstream repository license reviewed as MIT.
      - The checked-in folder was refreshed from current upstream and keeps a
        small public wording cleanup in references/mv-patterns.md.
      - The previous local folder matched older Dimillian/Skills commit
        ad1bb92d3e9ce8f42c993164d1048e949f520dca before upstream refined the
        SwiftUI refactor guidance and removed the long article-style reference.
      - Keep registry-local ownership until the upstream publishes an exact
        release tag for the reviewed content or the registry supports
        commit-only external pins across doctor, catalog, sync, and profile
        generation.
      - Narrow SwiftUI view-structure and dependency-pattern workflow selected
        as the next managed profile expansion after the Swift testing and
        Xcode Cloud slices.
      - OpenCode support is through the same manager-owned shared
        ~/.agents/skills root proven for the shared-root manager command.
      - Claude Code support is proven through a pinned upstream manager write
        to ~/.claude/skills for this skill.
      - Repo-local usage remains manual review until project profile and
        upstream manager behavior have equivalent proof.

