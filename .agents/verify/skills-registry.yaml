id: skills-registry
proof_kind: code
covers_scenarios: []
covers_boundaries: []
commands:
  - id: shell-syntax
    run: |
      set -e
      for file in scripts/skills_drift_report.sh scripts/test_skills_catalog.sh scripts/test_skills_doctor.sh scripts/test_skills_provenance_audit.sh scripts/test_skills_registry_verify.sh scripts/test_skills_setup_workflow_docs.sh scripts/test_skills_sync.sh scripts/test_skills_upstream_updates.sh; do
        bash -n "$file"
      done
      bash -n meeting-transcription/scripts/transcribe_meeting_audio.sh
      bash -n meeting-transcription/scripts/test_transcribe_meeting_audio.sh
      bash -n silent-pushes-setup/scripts/test_skill_contract.sh
      bash -n gemini-files-api/scripts/bootstrap.sh
      grep -Fx 'npm ci --ignore-scripts' gemini-files-api/scripts/bootstrap.sh
      node --check gemini-files-api/scripts/gemini-mm.mjs
      node --check gemini-files-api/scripts/test_gemini_mm.mjs
  - id: ruby-syntax
    run: ruby -c scripts/lib/external_git_pin.rb && ruby -c scripts/skills_catalog.rb && ruby -c scripts/skills_doctor.rb && ruby -c scripts/skills_provenance_audit.rb && ruby -c scripts/skills_sync.rb && ruby -c scripts/skills_upstream_updates.rb
  - id: skills-catalog-test
    run: scripts/test_skills_catalog.sh
  - id: skills-doctor-test
    run: scripts/test_skills_doctor.sh
  - id: registry-dispositions
    run: scripts/skills_doctor.rb
  - id: skills-provenance-audit-test
    run: scripts/test_skills_provenance_audit.sh
  - id: skills-registry-verify-test
    run: scripts/test_skills_registry_verify.sh
  - id: silent-pushes-setup-test
    run: silent-pushes-setup/scripts/test_skill_contract.sh
  - id: skills-setup-workflow-docs-test
    run: scripts/test_skills_setup_workflow_docs.sh
  - id: skills-sync-test
    run: scripts/test_skills_sync.sh
  - id: skills-upstream-updates-test
    run: scripts/test_skills_upstream_updates.sh
  - id: meeting-transcription-test
    run: meeting-transcription/scripts/test_transcribe_meeting_audio.sh
  - id: gemini-files-api-test
    run: node gemini-files-api/scripts/test_gemini_mm.mjs
  - id: provenance-audit
    run: scripts/skills_provenance_audit.rb --json > "{artifactsDir}/skills-provenance-audit.json"
  - id: catalog-check
    run: scripts/skills_catalog.rb --check
  - id: catalog-artifacts
    run: |
      scripts/skills_catalog.rb --json > "{artifactsDir}/skills.catalog.json"
      scripts/skills_catalog.rb --markdown > "{artifactsDir}/skills-catalog.md"
  - id: sync-plan
    run: scripts/skills_sync.rb --plan --json > "{artifactsDir}/skills-sync-plan.json"
  - id: registry-yaml
    run: |
      ruby -ryaml -e '
        files = [
          "skills.registry.yaml",
          *Dir.glob(".agents/**/*.{yaml,yml}", File::FNM_DOTMATCH),
          *Dir.glob("profiles/**/*.{yaml,yml}")
        ].select { |path| File.file?(path) }.uniq.sort
        files.each do |file|
          YAML.safe_load(File.read(file), aliases: false, filename: file)
        end
        puts "registry YAML parsed"
      '
  - id: skill-frontmatter
    run: |
      ruby -ryaml -e '
        files = Dir.glob("*/SKILL.md").sort
        raise "No skill entrypoints found" if files.empty?

        files.each do |file|
          lines = File.readlines(file, chomp: true)
          raise "#{file}: missing YAML front matter" unless lines.first == "---"
          closing = lines[1..]&.index("---")
          raise "#{file}: unterminated YAML front matter" unless closing

          frontmatter_lines = lines[1, closing]
          description_frontmatter_key_pattern = Regexp.new("\\A(?<indent>\\s*)(?:\\\"description\\\"|#{39.chr}description#{39.chr}|description)\\s*:(?<value>.*)\\z")
          description_plain_continuation_lines = lambda do |all_lines, start_index, description_indent|
            continuation_lines = []

            all_lines[(start_index + 1)..]&.each do |continuation_line|
              if continuation_line.strip.empty?
                continuation_lines << continuation_line
                next
              end

              break if continuation_line[/\A[ \t]*/].length <= description_indent

              continuation_lines << continuation_line.lstrip
            end

            continuation_lines
          end

          description_value_has_unquoted_comment = lambda do |value, continuation_lines|
            next false if value.start_with?("|", ">")

            value_lines = []
            value_lines << value unless value.empty?
            value_lines.concat(continuation_lines)
            next false if value_lines.empty?

            quoted_style = value_lines.first.start_with?("\"", 39.chr) ? value_lines.first[0] : nil
            in_quote = quoted_style
            first_line = true
            comment_found = false

            value_lines.each do |candidate_line|
              index = quoted_style && first_line ? 1 : 0
              first_line = false

              while index < candidate_line.length
                character = candidate_line[index]
                case in_quote
                when "\""
                  if character == "\""
                    backslash_count = 0
                    cursor = index - 1
                    while cursor >= 0 && candidate_line[cursor] == "\\"
                      backslash_count += 1
                      cursor -= 1
                    end
                    in_quote = nil if backslash_count.even?
                  end
                when 39.chr
                  next_character = candidate_line[index + 1]
                  if character == 39.chr && next_character == 39.chr
                    index += 1
                  elsif character == 39.chr
                    in_quote = nil
                  end
                else
                  if character == "#" && (index.zero? || candidate_line[index - 1].match?(/[[:space:]]/))
                    comment_found = true
                    break
                  end
                end

                index += 1
              end

              break if comment_found
            end

            comment_found
          end

          frontmatter_lines.each_with_index do |line, index|
            match = description_frontmatter_key_pattern.match(line)
            next unless match

            value = match[:value].lstrip
            plain_continuation_lines = description_plain_continuation_lines.call(frontmatter_lines, index, match[:indent].length)
            if description_value_has_unquoted_comment.call(value, plain_continuation_lines)
              raise "#{file}: front matter description contains an unquoted #; quote the value or use a block scalar"
            end
          end

          metadata = YAML.safe_load(frontmatter_lines.join("\n"), aliases: false) || {}
          ["name", "description"].each do |key|
            raise "#{file}: missing #{key}" if metadata[key].to_s.strip.empty?
          end
        end

        missing_agent_guide_paths = File.read("AGENTS.md")
          .scan(/`([^`\n]+\/SKILL\.md)`/)
          .flatten
          .reject { |path| File.file?(path) }
        unless missing_agent_guide_paths.empty?
          raise "AGENTS.md references missing skill entrypoints: #{missing_agent_guide_paths.join(", ")}"
        end

        puts "validated #{files.length} skill entrypoints"
      '
  - id: public-safety-docs
    run: |
      ruby -e '
        def glob_all_files(*patterns)
          Dir.glob(patterns.flatten, File::FNM_DOTMATCH).select do |path|
            File.file?(path) && ![".", ".."].include?(File.basename(path))
          end.map { |path| path.sub(%r{\A\./}, "") }
        end

        skill_files = glob_all_files(
          "*/.claude-plugin/**",
          "*/SKILL.md",
          "*/README.md",
          "*/agents/**",
          "*/assets/**/*",
          "*/examples/**/*",
          "*/plugin.json",
          "*/references/**/*",
          "*/scripts/**/*",
          "*/templates/**/*"
        )
        script_fixture_allowlist = {
          "scripts/test_skills_doctor.sh" => {
            "file URL fixture" => %r{file://[^[:space:]]*private-repo},
            "git config file URL fixture" => %r{url\.file:///tmp/private\.insteadOf}
          },
          "scripts/test_skills_upstream_updates.sh" => {
            "git config file URL fixture" => %r{url\.file:///tmp/private\.insteadOf},
            "Windows path fixture" => %r{C:[/\\]Users[/\\]alice[/\\][^[:space:]"\\]+}
          },
          "scripts/test_skills_sync.sh" => {
            "Windows path fixture" => %r{C:[/\\]Users[/\\]alice[/\\][^[:space:]"\\]+}
          },
          "scripts/test_skills_registry_verify.sh" => {
            "AWS key fixture" => %r{AKIA1234567890ABCDEF},
            "Bearer token fixture" => %r{Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9}
          },
          "scripts/test_skills_catalog.sh" => {
            "file URL fixture" => %r{file:///Users/alice/private-skill},
            "macOS path fixture" => %r{/Users/alice/private}
          },
          "scripts/test_skills_provenance_audit.sh" => {
            "file URL fixture" => %r{file:///Users/alice/private-source},
            "macOS path fixture" => %r{/Users/alice}
          }
        }
        script_files = glob_all_files("scripts/**/*")
        profile_files = glob_all_files("profiles/**/*")
        agent_files = glob_all_files(".agents/**/*")
        doc_files = glob_all_files("docs/**/*")
        files = [
          ".gitignore",
          "AGENTS.md",
          "README.md",
          "provenance.sources.yaml",
          "skills.catalog.json",
          "skills.lock.yaml",
          "skills.registry.yaml",
          *agent_files,
          *profile_files,
          *doc_files,
          *script_files,
          *skill_files
        ].uniq.sort
        patterns = {
          "macOS user path" => %r{/Users/[A-Za-z0-9._-]+},
          "Linux user path" => %r{/home/[A-Za-z0-9._-]+},
          "root home path" => %r{/root(?:/|\b)},
          "Windows user path" => %r{[A-Za-z]:[\\/]+Users[\\/]+[^\\/\s]+},
          "mac temp path" => %r{/var/folders/},
          "file URL" => %r{file://},
          "GitHub token" => %r{github_pat_|ghp_|gho_|ghu_|ghs_|ghr_},
          "OpenAI key" => %r{sk-[A-Za-z0-9_-]{20,}},
          "AWS access key" => %r{\b(?:A3T[A-Z0-9]|AKIA|ASIA)[A-Z0-9]{16}\b},
          "Bearer token" => %r{\bAuthorization:\s*Bearer\s+[A-Za-z0-9._~+\/-]{20,}\b}i,
          "private key" => %r{BEGIN [A-Z ]*PRIVATE KEY}
        }
        failures = []
        files.each do |file|
          next if file.split("/").include?("node_modules")
          next unless File.file?(file)
          text = File.binread(file).force_encoding(Encoding::UTF_8).scrub
          if [".agents/verify/skills-registry.yaml", "scripts/skills_catalog.rb"].include?(file)
            # These verifier/generator files carry the regex literals used by
            # public-safety scans. Strip only those pattern-definition lines
            # before matching so the scanner can scan itself without hiding
            # real leaks elsewhere.
            text = text.gsub(/^\s*"[^"]+" => %r\{.*\},?\n?/, "")
          end
          if script_fixture_allowlist.key?(file)
            fixture_patterns = script_fixture_allowlist.fetch(file).values
            text = text.each_line.reject { |line| fixture_patterns.any? { |pattern| line.match?(pattern) } }.join
          end
          patterns.each do |label, pattern|
            failures << "#{file}: #{label}" if text.match?(pattern)
          end
        end
        abort "public-safety scan failed:\n#{failures.join("\n")}" unless failures.empty?
        puts "public-safety scan ok"
      '
  - id: drift-snapshot
    run: SKILLS_REPORT_SHOW_PATHS=0 PROJECTS_ROOT="$PWD" bash scripts/skills_drift_report.sh > "{artifactsDir}/skill-drift-snapshot.md"
required_artifacts:
  - paths.txt
  - skill-drift-snapshot.md
  - skills-catalog.md
  - skills.catalog.json
  - skills-provenance-audit.json
  - skills-sync-plan.json
required_pass_signals:
  - shell-syntax
  - ruby-syntax
  - skills-catalog-test
  - skills-doctor-test
  - registry-dispositions
  - skills-provenance-audit-test
  - skills-registry-verify-test
  - silent-pushes-setup-test
  - skills-setup-workflow-docs-test
  - skills-sync-test
  - skills-upstream-updates-test
  - meeting-transcription-test
  - gemini-files-api-test
  - provenance-audit
  - catalog-check
  - catalog-artifacts
  - sync-plan
  - registry-yaml
  - skill-frontmatter
  - public-safety-docs
  - drift-snapshot
failure_patterns:
  - "error:"
  - "FAIL"
evidence_extractors:
  - artifact-manifest
  - command-stdout
