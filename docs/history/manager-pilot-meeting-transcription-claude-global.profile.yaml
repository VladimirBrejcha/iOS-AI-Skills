schema_version: 0.1
status: historical-proof-target
profile:
  id: manager-pilot-meeting-transcription-claude-global
  owner: maintainers
  purpose: >
    Historical proof target for the reviewed Claude Code manager-owned
    meeting-transcription and gemini-files-api dependency writes. This profile
    is not auto-loaded by default and is retained for audit context.

registry:
  path_hint: ../..
  manifest: ../../skills.registry.yaml

consumer_roots:
  claude_global_manager:
    path: ~/.claude/skills
    adapter: manager-copy
    status: historical-proof-target

selected_skills:
  - skill_id: gemini-files-api
    expose_to:
      - claude_global_manager
    state: active
  - skill_id: meeting-transcription
    expose_to:
      - claude_global_manager
    state: active

non_goals:
  - installing skills other than meeting-transcription and gemini-files-api
  - changing ~/.agents/skills
  - changing ~/.codex/skills
  - stale cleanup
