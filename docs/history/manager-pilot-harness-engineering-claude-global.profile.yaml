schema_version: 0.1
status: historical-proof-target
profile:
  id: manager-pilot-harness-engineering-claude-global
  owner: maintainers
  purpose: >
    Historical proof target for the first reviewed Claude Code manager-owned
    write in this registry. This profile is not auto-loaded by default and is
    retained for audit context.

registry:
  path_hint: ../..
  manifest: ../../skills.registry.yaml

consumer_roots:
  claude_global_manager:
    path: ~/.claude/skills
    adapter: manager-copy
    status: historical-proof-target

selected_skills:
  - skill_id: harness-engineering
    expose_to:
      - claude_global_manager
    state: active

non_goals:
  - installing more than harness-engineering
  - changing the default machine profile
  - changing ~/.agents/skills
  - changing ~/.codex/skills
  - stale cleanup
